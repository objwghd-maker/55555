<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker Game</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #121212; color: white; }
    input { padding: 10px; font-size: 16px; margin-bottom: 20px; text-align: center; border-radius: 5px; border: none; }
    button { padding: 15px 40px; font-size: 24px; cursor: pointer; background: #00e676; border: none; border-radius: 8px; font-weight: bold; }
    button:active { transform: scale(0.95); }
    h1 { color: #00e676; }
  </style>
</head>
<body>
  <h1>เกมกดทำคะแนน</h1>
  <input type="text" id="username" placeholder="ใส่ชื่อของคุณ" /><br><br>
  <button onclick="addScore()">CLICK!</button>
  <h2 id="my-score">คะแนนของคุณ: 0</h2>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ใช้ฐานข้อมูลกลางฟรี (ไม่ต้องตั้งค่าอะไรเพิ่ม)
    const firebaseConfig = {
      databaseURL: "https://testing-db-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let score = 0;

    window.addScore = function() {
      const name = document.getElementById('username').value.trim();
      if (!name) {
        alert('กรุณาใส่ชื่อก่อนกดครับ!');
        return;
      }
      score++;
      document.getElementById('my-score').innerText = `คะแนนของคุณ: ${score}`;
      
      // ส่งคะแนนไปเซิร์ฟเวอร์แบบ Realtime
      set(ref(db, 'users/' + name), {
        name: name,
        score: score
      });
    }
  </script>
</body>
</html>
