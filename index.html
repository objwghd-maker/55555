<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Clicker Game</title>
  <style>
    body { font-family: sans-serif; background: #1e1b4b; color: white; text-align: center; padding: 30px 20px; }
    .card { background: #312e81; padding: 30px; border-radius: 16px; max-width: 360px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #818cf8; font-size: 24px; margin-bottom: 15px; }
    input { width: 90%; padding: 12px; border-radius: 8px; border: none; text-align: center; font-size: 16px; margin-bottom: 20px; }
    .score-title { font-size: 14px; color: #c7d2fe; }
    .score-num { font-size: 48px; color: #fbbf24; font-weight: bold; margin: 10px 0; }
    .btn-click { width: 100%; padding: 20px; font-size: 22px; font-weight: bold; background: #f59e0b; color: white; border: none; border-radius: 12px; cursor: pointer; }
    .btn-click:active { transform: scale(0.95); }
    .btn-send { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    #status { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 หน้าสำหรับ "ผู้เล่น"</h1>
    <input type="text" id="username" placeholder="กรอกชื่อผู้เล่นตรงนี้">
    
    <div class="score-title">คะแนนปัจจุบัน</div>
    <div class="score-num" id="score-display">0</div>
    
    <button class="btn-click" id="click-btn">CLICK! 👆</button>
    <button class="btn-send" id="send-btn">🚀 ส่งคะแนนเข้า Admin</button>
    
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const app = initializeApp({ databaseURL: "https://testing-db-default-rtdb.asia-southeast1.firebasedatabase.app/" });
    const db = getDatabase(app);

    let score = 0;
    const scoreDisplay = document.getElementById('score-display');
    const statusDiv = document.getElementById('status');

    document.getElementById('click-btn').addEventListener('click', () => {
      score++;
      scoreDisplay.innerText = score;
    });

    document.getElementById('send-btn').addEventListener('click', () => {
      const name = document.getElementById('username').value.trim();
      if (!name) {
        alert('กรุณากรอกชื่อผู้เล่นด้วยครับ');
        return;
      }

      set(ref(db, 'users/' + name), { name: name, score: score });
      statusDiv.innerHTML = "<b style='color:#34d399;'>✅ ส่งคะแนนเรียบร้อยแล้ว!</b>";
    });
  </script>
</body>
</html>
