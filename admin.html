<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #090d16; color: #e2e8f0; padding: 30px 15px; }
    .container { max-width: 600px; margin: auto; background: #111827; padding: 20px; border-radius: 12px; border: 1px solid #1f2937; }
    .header { text-align: center; border-bottom: 2px solid #1f2937; padding-bottom: 15px; margin-bottom: 15px; }
    h1 { color: #10b981; font-size: 22px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1f2937; }
    th { background: #1f2937; color: #10b981; }
    .score-val { color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 หน้าสำหรับ "ADMIN" (ดูตารางคะแนน)</h1>
      <p style="font-size: 13px; color: #9ca3af;">อัปเดตข้อมูลอัตโนมัติแบบ Real-time</p>
    </div>

    <table>
      <thead>
        <tr>
          <th>อันดับ</th>
          <th>ชื่อผู้เล่น</th>
          <th>คะแนน</th>
        </tr>
      </thead>
      <tbody id="user-table">
        <tr><td colspan="3" style="text-align:center; color:#6b7280;">กำลังรอข้อมูลจากผู้เล่น...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const app = initializeApp({ databaseURL: "https://testing-db-default-rtdb.asia-southeast1.firebasedatabase.app/" });
    const db = getDatabase(app);

    onValue(ref(db, 'users'), (snapshot) => {
      const data = snapshot.val();
      const tableBody = document.getElementById('user-table');
      tableBody.innerHTML = '';

      if (data) {
        const sorted = Object.values(data).sort((a, b) => b.score - a.score);
        sorted.forEach((u, index) => {
          tableBody.innerHTML += `<tr>
            <td><b>#${index + 1}</b></td>
            <td>${u.name}</td>
            <td class="score-val">${u.score}</td>
          </tr>`;
        });
      } else {
        tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#6b7280;">ยังไม่มีข้อมูลผู้เล่น</td></tr>';
      }
    });
  </script>
</body>
</html>
